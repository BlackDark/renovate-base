name: validate-renovate-config

on:
  push:
    paths:
      - "**/*.json5"
      - ".github/workflows/validate-renovate-config.yml"
  pull_request:
    paths:
      - "**/*.json5"
      - ".github/workflows/validate-renovate-config.yml"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: ghcr.io/renovatebot/renovate:44.87.1@sha256:4e8c64197947c14df5b44c889aea945f2ad8460bf1bb6c96f339a84c0aff6a38
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON5 with renovate-config-validator
        run: |
          set -euo pipefail
          files=$(git ls-files '*.json5')
          if [ -z "${files}" ]; then
            echo "No JSON5 files found"
            exit 1
          fi
          renovate-config-validator --strict --no-global ${files}
