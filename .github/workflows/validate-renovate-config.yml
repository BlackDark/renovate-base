name: validate-renovate-config

on:
  push:
    paths:
      - "**/*.json5"
      - ".github/workflows/validate-renovate-config.yml"
  pull_request:
    paths:
      - "**/*.json5"
      - ".github/workflows/validate-renovate-config.yml"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate JSON5 with renovate-config-validator
        run: |
          set -euo pipefail
          files=$(git ls-files '*.json5')
          if [ -z "${files}" ]; then
            echo "No JSON5 files found"
            exit 1
          fi
          npx --yes --package renovate@44.87.1 -- \
            renovate-config-validator --strict --no-global ${files}
